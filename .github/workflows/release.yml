name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches qualiax.version.__version__
        run: |
          pkg_version="$(python -c 'import runpy; print(runpy.run_path("qualiax/version.py")["__version__"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag: ${GITHUB_REF_NAME}  package: ${pkg_version}"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match qualiax.version.__version__ (${pkg_version})"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      # Run from outside the checkout so Python imports the installed wheel, not ./qualiax.
      - name: Smoke-test the built wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          qualiax --help > /dev/null
          python -m qualiax --help > /dev/null
          python -c "import qualiax, qualiax.metrics as m; assert m._proxy_calibration(), 'calibration data missing from wheel'; print(qualiax.__file__, qualiax.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qualiax/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the release with the published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "qualiax ${GITHUB_REF_NAME#v}"
