[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qualiax"
version = "1.0.0"
description = "Perceptual speech and audio quality analyzer CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "qualiax" }]

keywords = ["audio", "speech", "quality", "MOS", "PESQ", "STOI", "SNR", "EBU R128", "perceptual"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0",
    "numpy>=1.23",
    "scipy>=1.9",
    # Optional but strongly recommended — see extras below
]

[project.optional-dependencies]
# Recommended: full audio format support
audio = [
    "soundfile>=0.12",
    "pydub>=0.25",
]
# Intrusive perceptual metrics
perceptual = [
    "pesq>=0.0.4",
    "pystoi>=0.3",
]
# Live capture mode
live = [
    "sounddevice>=0.4",
]
# Event-driven watch mode
watch = [
    "watchdog>=4.0",
]
# Learned MOS / neural pitch
ml = [
    "onnxruntime>=1.17",
]
# Full install (everything)
all = [
    "soundfile>=0.12",
    "pydub>=0.25",
    "pesq>=0.0.4",
    "pystoi>=0.3",
    "librosa>=0.10",
    "sounddevice>=0.4",
    "watchdog>=4.0",
    "onnxruntime>=1.17",
]

[project.scripts]
qualiax = "qualiax.cli:main"

[project.urls]
Repository = "https://github.com/TheColby/qualiax"
Issues = "https://github.com/TheColby/qualiax/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qualiax*"]

[tool.setuptools]
package-dir = {"" = "."}
