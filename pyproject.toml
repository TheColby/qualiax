[build-system]
# setuptools 77 is the first release that supports PEP 639 SPDX `license`
# strings and `project.license-files` without deprecation warnings.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qualiax"
dynamic = ["version"]
description = "Perceptual speech and audio quality analyzer CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Colby Leider", email = "colbyleider@gmail.com" }]

keywords = ["audio", "speech", "quality", "MOS", "PESQ", "STOI", "SNR", "EBU R128", "perceptual"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.0",
    "numpy>=1.23",
    "scipy>=1.9",
    # TOML rule/insight files use the stdlib tomllib on 3.11+.
    "tomli>=1.1; python_version < '3.11'",
    # Optional but strongly recommended — see extras below
]

[project.optional-dependencies]
# Recommended: full audio format support
audio = [
    "soundfile>=0.12",
    "pydub>=0.25",
]
# Intrusive perceptual metrics
perceptual = [
    "pesq>=0.0.4",
    "pystoi>=0.3",
]
# Live capture mode
live = [
    "sounddevice>=0.4",
]
# Event-driven watch mode
watch = [
    "watchdog>=4.0",
]
# Learned MOS / neural pitch
ml = [
    "onnxruntime>=1.17",
]
# Full install (everything)
all = [
    "soundfile>=0.12",
    "pydub>=0.25",
    "pesq>=0.0.4",
    "pystoi>=0.3",
    "librosa>=0.10",
    "sounddevice>=0.4",
    "watchdog>=4.0",
    "onnxruntime>=1.17",
]
# Test / development tooling
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
qualiax = "qualiax.cli:main"

[project.urls]
Homepage = "https://github.com/TheColby/qualiax"
Repository = "https://github.com/TheColby/qualiax"
Issues = "https://github.com/TheColby/qualiax/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["qualiax", "qualiax.*"]

[tool.setuptools.package-data]
qualiax = ["py.typed", "data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "qualiax.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
